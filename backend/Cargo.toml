[package]
name = "blog-backend"
version = "0.1.0"
edition = "2021"
authors = ["Blog System"]
description = "A high-performance blog backend built with Rust and Axum"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "derive",
    "chrono",
    "uuid",
    "json",
] }

# Redis
redis = { version = "1.8.3", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", features = ["chrono04"] }
sha2 = "0.11"
base64 = "0.23.1"

# Authentication
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"

# Markdown rendering
pulldown-cmark = "0.13"
syntect = "5"
# Extra syntaxes for syntect (TOML, TypeScript, Dockerfile, Vue, Kotlin, ...)
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
regex = "1.13.2"

# S3 storage
aws-sdk-s3 = "1.161.0"
aws-config = "1.13.3"

# HTTP client
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }

# Async trait (required for custom extractors)
async-trait = "0.1.92"
futures = "0.3.34"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "blog-backend"
path = "src/main.rs"

[dev-dependencies]
tokio-test = "0.4"
